[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
# Used as a Git dependency (docs/rust.md), not from crates.io.
publish = false
authors = ["Niklas Forst"]
repository = "https://github.com/nforst/fagus"
homepage = "https://github.com/nforst/fagus"
description = "HTML and CSS to PDF, without a browser"

[workspace.dependencies]
fagus-dom = { path = "crates/fagus-dom" }
fagus-css = { path = "crates/fagus-css" }
fagus-style = { path = "crates/fagus-style" }
fagus-text = { path = "crates/fagus-text" }
fagus-layout = { path = "crates/fagus-layout" }
fagus-paint = { path = "crates/fagus-paint" }
# Their default feature `parallel` is chosen by the crates that use them.
fagus-pdf = { path = "crates/fagus-pdf", default-features = false }
fagus = { path = "crates/fagus", default-features = false }

html5ever = "0.40.1"
markup5ever = "0.40.0"
# Parses XHTML documents (.xhtml) as XML, as browsers do; same tree interface as html5ever.
xml5ever = "0.40.0"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["into_owned", "substitute_variables"] }
parcel_selectors = "0.28.3"
cssparser = "0.37.0"
skrifa = "0.49.0"
harfrust = "0.15.0"
unicode-linebreak = "0.1.5"
# Line breaks inside words of Thai, Lao, Khmer and Myanmar text, found with a dictionary as ICU finds
# them in Chrome (UAX #14 leaves them to "complex context" analysis).
icu_segmenter = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
# General categories, for the characters that take emphasis marks; rustybuzz already depends on it.
unicode-properties = { version = "0.1.5", default-features = false, features = ["emoji", "general-category"] }
# The bidirectional algorithm (UAX #9) for right-to-left and mixed text.
unicode-bidi = "0.3.18"
# Fagus shapes text itself, so krilla's own shaper (simple-text) is not needed.
# krilla's `rayon` (with fagus-pdf's feature `parallel`) compresses the content streams of pages
# side by side.
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
rayon = "1.12.0"
imagesize = "0.14.0"
krilla-svg = "0.8.1"
usvg = "0.47.0"
# Draws the pixels of SVG images that filters change; krilla-svg already depends on it.
resvg = { version = "0.47.0", default-features = false }
# krilla compresses with flate2; the zlib-rs backend is several times faster than miniz_oxide.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
rustc-hash = "2.1.3"
# Rasterizes the glyphs of blurred text shadows; krilla-svg already depends on it.
tiny-skia = "0.12.0"
# Decode the images that filters change; krilla already depends on them.
png = "0.18.1"
zune-jpeg = "0.5.15"
image-webp = "0.2.4"
gif = "0.14.2"
# Indexes the fonts installed on the system (opt-in); usvg already depends on it.
fontdb = { version = "0.23.0", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }
# WOFF and WOFF2 fonts are unpacked to OpenType before use.
wuff = "0.2.9"
# Decompresses the embedded hyphenation dictionaries (wuff already uses it for WOFF2).
brotli-decompressor = { version = "5.0.3", default-features = false }
smallvec = "1.16.4"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
too_many_lines = "allow"
# Value conversions map several CSS keywords to the same computed value on purpose.
match_same_arms = "allow"
trivially_copy_pass_by_ref = "allow"
unused_self = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.bench]
inherits = "release"
debug = "line-tables-only"
