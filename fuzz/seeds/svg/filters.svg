<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100" viewBox="0 0 100 100">
<defs><filter id="f" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence baseFrequency="0.05" numOctaves="2"/>
<feDisplacementMap in="SourceGraphic" scale="5"/><feMorphology operator="dilate" radius="1"/><feColorMatrix type="saturate" values="0.5"/>
<feComponentTransfer><feFuncR type="table" tableValues="0 1"/></feComponentTransfer><feOffset dx="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="p" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="blue"/></pattern>
<radialGradient id="r" fx="0.3" spreadMethod="reflect"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
<clipPath id="c"><circle cx="50" cy="50" r="40"/></clipPath><mask id="m"><rect width="100" height="100" fill="url(#r)"/></mask>
<symbol id="a" viewBox="0 0 10 10"><path d="M0 0L10 10Q5 0 0 10zM2 2a3 3 0 1 0 6 0"/></symbol><marker id="k" markerWidth="4" markerHeight="4"><circle r="2"/></marker></defs>
<g clip-path="url(#c)" mask="url(#m)" filter="url(#f)" transform="rotate(10 50 50) scale(0.9)"><rect width="100" height="100" fill="url(#p)"/></g>
<use xlink:href="#a" x="10" y="10" width="20" height="20"/><polyline points="0,0 50,20 90,90" fill="none" stroke="red" stroke-dasharray="2 1" marker-mid="url(#k)"/>
<text x="10" y="90" font-family="sans-serif" font-size="10" textLength="60" lengthAdjust="spacingAndGlyphs">Text<tspan dy="-3" fill="red">span</tspan></text>
<switch><foreignObject width="50" height="20"><p xmlns="http://www.w3.org/1999/xhtml">html</p></foreignObject><rect width="1" height="1"/></switch>
<style>rect { stroke: green } @media print { text { font-weight: bold } }</style></svg>
