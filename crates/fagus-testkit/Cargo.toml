[package]
publish = false
name = "fagus-testkit"
description = "Conformance tests for Fagus: web-platform-tests reftests and the corpus against Chrome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# With the features of the command line tool, so that CI builds both from the same compiled crates.
fagus = { workspace = true, features = ["parallel"] }
fagus-dom.workspace = true
clap.workspace = true
anyhow.workspace = true
# Writes the pages of failing tests as images for a look.
png.workspace = true
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "fagus-conformance"
path = "src/main.rs"
