[package]
name = "fagus-ffi"
description = "C ABI shared library for Fagus, for PHP's FFI extension (spike)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "fagus_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# The engine itself: the point of the spike is to link and load the real dependency graph, so a
# standalone stub would not answer the question about the glibc floor or the DLL's imports.
fagus = { workspace = true, features = ["parallel"] }
