<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Reference: GCPM string-set on element with display: none</title>
<style>
@page { @top-center { content: "Chapter Two Title"; } }
@page :first { @top-center { content: "Chapter One Title"; } }
#d2 { break-before: page; }
</style>
</head>
<body>
<p>Note: test has two pages</p>
<p>Test passes if:</p>
<ol>
<li>
“Chapter One Title” appears in the running head on page one.
</li>
<li>
“Chapter Two Title” appears in the running head on page two.
</li>
</ol>

<div id="d2">
<p>Second Page</p>
</div>
</body>
</html>
