<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <defs>
    <linearGradient id="lg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff7a18"/><stop offset=".5" stop-color="#af002d"/><stop offset="1" stop-color="#319197"/>
    </linearGradient>
    <radialGradient id="rg" cx=".35" cy=".35" r=".65" fx=".3" fy=".3">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#1e5799"/>
    </radialGradient>
    <pattern id="pt" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="10" fill="#f0c419"/>
    </pattern>
    <mask id="mk"><rect width="300" height="100" fill="#fff"/><circle cx="50" cy="50" r="18" fill="#000"/></mask>
    <clipPath id="cp"><circle cx="250" cy="50" r="40"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity=".4"/></filter>
  </defs>
  <rect x="5" y="5" width="90" height="90" rx="12" fill="url(#rg)" mask="url(#mk)"/>
  <rect x="105" y="20" width="90" height="60" fill="url(#pt)" stroke="#333"/>
  <g clip-path="url(#cp)"><rect x="200" y="0" width="100" height="100" fill="url(#lg)"/></g>
  
</svg>
