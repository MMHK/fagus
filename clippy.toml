# Product and standard names that are not code.
doc-valid-idents = ["ZUGFeRD", "XRechnung", "PingFang", "SASLprep", ".."]
# The transcendental functions of the standard library go to the system's libm, whose last bits
# differ between glibc versions and macOS: what reaches the PDF would differ between platforms.
# Use the `libm` crate's (libm::sinf, libm::powf …), the same everywhere. `sqrt`, `mul_add` and
# `powi` are exact or computed the same everywhere and stay allowed.
disallowed-methods = [
  { path = "f32::sin", reason = "differs between platforms; use the libm crate" },
  { path = "f32::cos", reason = "differs between platforms; use the libm crate" },
  { path = "f32::tan", reason = "differs between platforms; use the libm crate" },
  { path = "f32::asin", reason = "differs between platforms; use the libm crate" },
  { path = "f32::acos", reason = "differs between platforms; use the libm crate" },
  { path = "f32::atan", reason = "differs between platforms; use the libm crate" },
  { path = "f32::atan2", reason = "differs between platforms; use the libm crate" },
  { path = "f32::sinh", reason = "differs between platforms; use the libm crate" },
  { path = "f32::cosh", reason = "differs between platforms; use the libm crate" },
  { path = "f32::tanh", reason = "differs between platforms; use the libm crate" },
  { path = "f32::asinh", reason = "differs between platforms; use the libm crate" },
  { path = "f32::acosh", reason = "differs between platforms; use the libm crate" },
  { path = "f32::atanh", reason = "differs between platforms; use the libm crate" },
  { path = "f32::exp", reason = "differs between platforms; use the libm crate" },
  { path = "f32::exp2", reason = "differs between platforms; use the libm crate" },
  { path = "f32::exp_m1", reason = "differs between platforms; use the libm crate" },
  { path = "f32::ln", reason = "differs between platforms; use the libm crate" },
  { path = "f32::log", reason = "differs between platforms; use the libm crate" },
  { path = "f32::log2", reason = "differs between platforms; use the libm crate" },
