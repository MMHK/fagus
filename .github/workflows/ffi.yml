name: FFI

# The C ABI shared library (`crates/fagus-ffi`, docs/plans/2026-11-20-php-ffi-cdylib.md): built
# for the three supported platforms, smoke-tested with PHP 7.4 to 8.5 and unit-tested on 7.4 and
# 8.5. The format, clippy and
# the Rust tests are ci.yml's, which covers the whole workspace. Publishing is release.yml.
on:
  push:
    branches: [main]
    paths:
      - crates/fagus-ffi/**
      - crates/fagus-protocol/**
      - crates/fagus-cli/**
      - php/fagus-ffi/**
      - .github/workflows/ffi.yml
  pull_request:
    paths:
      - crates/fagus-ffi/**
      - crates/fagus-protocol/**
      - crates/fagus-cli/**
      - php/fagus-ffi/**
      - .github/workflows/ffi.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x64:
    name: Linux x86_64 (glibc 2.17) and PHP 7.4-8.5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi-linux-x64
      # The crates are in Cargo.lock now, so the build is locked like the rest of CI.
      - name: Build against glibc 2.17
        run: |
          pip install ziglang==0.16.0
          cargo install --locked cargo-zigbuild@0.23.4
          cargo zigbuild --release --locked -p fagus-ffi --target x86_64-unknown-linux-gnu.2.17
      - name: Symbols and glibc floor
        run: |
          so=target/x86_64-unknown-linux-gnu/release/libfagus_ffi.so
          ls -l "$so"
          echo '--- exported symbols (expect fagus_*) ---'
          nm -D --defined-only "$so" | awk '{print $3}' | sort
          echo '--- required glibc versions ---'
          objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -5
          highest=$(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "highest: $highest"
          if [ "$highest" != "GLIBC_2.17" ]; then
            echo "::error::the library needs $highest, not GLIBC_2.17"
            exit 1
          fi
          if objdump -T "$so" | grep -q 'GLIBCXX_\|CXXABI_'; then
            echo "::error::the library depends on libstdc++, which it should not"
            exit 1
          fi
      - name: PHP smoke tests
        run: |
          so=/w/target/x86_64-unknown-linux-gnu/release/libfagus_ffi.so
          for version in 7.4 8.0 8.3 8.4 8.5; do
            echo "== PHP $version =="
            docker run --rm -v "$PWD:/w" -w /w "php:$version-cli" \
              sh /w/php/fagus-ffi/tests/php-smoke.sh /w/php/fagus-ffi "$so"
          done
      # The PHPUnit suite at both ends of the range: PHPUnit 9.6 on 7.4, 12 on 8.5.
      - name: PHPUnit on PHP 7.4
        run: |
          so=/w/target/x86_64-unknown-linux-gnu/release/libfagus_ffi.so
          docker run --rm -v "$PWD:/w" -w /w php:7.4-cli \
            sh /w/php/fagus-ffi/tests/php-unit.sh /w/php/fagus-ffi "$so"
      - name: PHPUnit on PHP 8.5
        run: |
          so=/w/target/x86_64-unknown-linux-gnu/release/libfagus_ffi.so
          docker run --rm -v "$PWD:/w" -w /w php:8.5-cli \
            sh /w/php/fagus-ffi/tests/php-unit.sh /w/php/fagus-ffi "$so"
      # Byte identity with the command line tool: the same HTML and the same --created through
      # both paths must give the same PDF (docs/plans/2026-11-20-php-ffi-cdylib.md, section 7).
      # The document has no external resources, so the base directory does not matter.
      - name: The library and the command line agree byte for byte
        run: |
          cargo build --release --locked -p fagus-cli
          mkdir -p parity
          cat > parity/document.html <<'HTML'
          <!doctype html><html lang="en"><head><title>Parity</title>
          <style>h1 { color: teal } .note { margin-top: 1em }</style></head>
          <body><h1 id="title">Fagus</h1><p class="note">Same bytes on every path.</p></body></html>
          HTML
          target/release/fagus render parity/document.html -o parity/cli.pdf \
            --created 2026-11-20T00:00:00Z
          docker run --rm -v "$PWD:/w" -w /w php:8.4-cli sh -c '
            apt-get update -qq
            apt-get install -y -qq libffi-dev >/dev/null
            docker-php-ext-install ffi >/dev/null
            php -d ffi.enable=true /w/php/fagus-ffi/tests/parity.php \
              /w/target/x86_64-unknown-linux-gnu/release/libfagus_ffi.so \
              /w/parity/document.html /w/parity/ffi.pdf 2026-11-20T00:00:00Z'
          cmp parity/cli.pdf parity/ffi.pdf
          ls -l parity/*.pdf
      # `ffi.enable` is `preload` by default, so a pool needs `ffi.enable=true` or a file that
      # OPcache preloads; both are checked against a real php-fpm, and that the default refuses
      # FFI in a request (docs/php.md).
      - name: FFI in PHP-FPM
        run: |
          docker run --rm -v "$PWD:/w" -w /w php:8.4-fpm sh /w/php/fagus-ffi/tests/fpm-preload.sh \
            /w/php/fagus-ffi /w/target/x86_64-unknown-linux-gnu/release/libfagus_ffi.so

  linux-arm64:
    name: Linux aarch64 (glibc 2.17) and PHP 8.4
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi-linux-arm64
      - name: Build against glibc 2.17
        run: |
          pip install ziglang==0.16.0
          cargo install --locked cargo-zigbuild@0.23.4
          cargo zigbuild --release --locked -p fagus-ffi --target aarch64-unknown-linux-gnu.2.17
      - name: Symbols and glibc floor
        run: |
          so=target/aarch64-unknown-linux-gnu/release/libfagus_ffi.so
          ls -l "$so"
          nm -D --defined-only "$so" | awk '{print $3}' | sort
          objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -5
      - name: PHP smoke test
        run: |
          so=/w/target/aarch64-unknown-linux-gnu/release/libfagus_ffi.so
          docker run --rm -v "$PWD:/w" -w /w php:8.4-cli \
            sh /w/php/fagus-ffi/tests/php-smoke.sh /w/php/fagus-ffi "$so"

  windows-x64:
    name: Windows x86_64 (static CRT) and PHP 7.4, 8.5
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi-windows-x64
      - uses: ilammy/msvc-dev-cmd@v1
      # The static CRT is what removes the Visual C++ redistributable from the picture, so that
      # one DLL serves PHP 7.4 (VS15) and 8.5 (VS17). RUSTFLAGS is scoped to this step so that the
      # Windows CLI binary keeps the dynamic CRT, as release.yml does.
      - name: Build with the static CRT
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p fagus-ffi --target x86_64-pc-windows-msvc
      - name: DLL dependencies
        shell: pwsh
        run: |
          $dll = "target/x86_64-pc-windows-msvc/release/fagus_ffi.dll"
          Get-Item $dll | Format-List Length, FullName
          dumpbin /dependents $dll
          $deps = dumpbin /dependents $dll | Out-String
          if ($deps -match 'VCRUNTIME|MSVCP|ucrtbase|MSVCR') {
            Write-Error "the DLL still depends on the Visual C++ runtime"
            exit 1
          }
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi
          ini-values: ffi.enable=true
      - name: Smoke test with PHP 8.4
        run: php php/fagus-ffi/tests/smoke.php target/x86_64-pc-windows-msvc/release/fagus_ffi.dll
      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ffi
          ini-values: ffi.enable=true
      - name: Smoke test with PHP 8.5
        run: php php/fagus-ffi/tests/smoke.php target/x86_64-pc-windows-msvc/release/fagus_ffi.dll
      - name: PHPUnit with PHP 8.5
        env:
          FAGUS_FFI_LIB: target/x86_64-pc-windows-msvc/release/fagus_ffi.dll
        run: |
          composer install --working-dir php/fagus-ffi --no-interaction --no-progress
          php -d ffi.enable=true php/fagus-ffi/vendor/bin/phpunit -c php/fagus-ffi/phpunit.xml.dist
      - name: PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: ffi
          ini-values: ffi.enable=true
      - name: Smoke test with PHP 7.4
        run: php php/fagus-ffi/tests/smoke.php target/x86_64-pc-windows-msvc/release/fagus_ffi.dll
