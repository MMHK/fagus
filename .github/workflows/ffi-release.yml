name: FFI preview release

# Builds the C ABI shared library for the three supported platforms, checks it, smoke-tests it
# with PHP 7.4 to 8.4, and assembles the PHP package with the binaries in lib/<platform>/. A tag
# named ffi-v<version> puts the archives, their sums and an SBOM-free draft release on GitHub; the
# draft is not public until someone publishes it. Run it by hand with a version to build without
# publishing (docs/plans/2026-11-20-php-ffi-cdylib.md).
on:
  push:
    tags:
      - 'ffi-v*'
  workflow_dispatch:
    inputs:
      version:
        description: The version to build without publishing, as in Cargo.toml (0.2.0), optionally with -rc1
        required: true

permissions:
  contents: write
  # Attestations: the OIDC token that Sigstore signs with, and writing them to the repository.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ffi-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  library:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.17 covers Debian 11 and later; no musl, because PHP's own images are glibc.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, zig: x86_64-unknown-linux-gnu.2.17, platform: linux-x86_64, smoke: docker-x64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, zig: aarch64-unknown-linux-gnu.2.17, platform: linux-aarch64, smoke: docker-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, platform: windows-x86_64, smoke: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#ffi-v}"
          fi
          base="${version%%-*}"
          if ! grep -q "^version = \"$base\"$" Cargo.toml; then
            echo "::error::Cargo.toml is not at version $base"
            exit 1
          fi
          echo "FAGUS_VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi-release-${{ matrix.target }}
      - name: Build with zig
        if: matrix.zig
        run: |
          pip install ziglang==0.16.0
          cargo install --locked cargo-zigbuild@0.23.4
          cargo zigbuild --release --locked -p fagus-ffi --target ${{ matrix.zig }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # The static CRT removes the Visual C++ redistributable from the picture, so one DLL serves
      # PHP 7.4 (VS15) and 8.4 (VS17). The flag has to cover the dependency graph as well, which
      # only RUSTFLAGS does; it is scoped to this step (the spike proved it on MSVC). Blanket use
      # across the whole workflow would change the Windows CLI binary too.
      - name: Build with the static CRT
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p fagus-ffi --target ${{ matrix.target }}
      - name: Symbols and glibc floor
        if: runner.os == 'Linux'
        run: |
          so="target/${{ matrix.target }}/release/libfagus_ffi.so"
          ls -l "$so"
          echo '--- exported symbols (expect fagus_*) ---'
          nm -D --defined-only "$so" | awk '{print $3}' | sort
          echo '--- required glibc versions ---'
          objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -5
          highest=$(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          if [ "$highest" != "GLIBC_2.17" ]; then
            echo "::error::the library needs $highest, not GLIBC_2.17"
            exit 1
          fi
          if objdump -T "$so" | grep -q 'GLIBCXX_\|CXXABI_'; then
            echo "::error::the library depends on libstdc++, which it should not"
            exit 1
          fi
      - name: DLL dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = "target/${{ matrix.target }}/release/fagus_ffi.dll"
          Get-Item $dll | Format-List Length, FullName
          $deps = dumpbin /dependents $dll | Out-String
          if ($deps -match 'VCRUNTIME|MSVCP|ucrtbase|MSVCR') {
            Write-Error "the DLL still depends on the Visual C++ runtime"
            exit 1
          }
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            lib="target/${{ matrix.target }}/release/fagus_ffi.dll"
          else
            lib="target/${{ matrix.target }}/release/libfagus_ffi.so"
          fi
          cp "$lib" dist/
          cp crates/fagus-ffi/include/fagus.h dist/
          cp php/fagus-ffi/README.md dist/README.md
          tar -czf "fagus-ffi-${{ matrix.target }}.tar.gz" -C dist .
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/*' -DestinationPath 'fagus-ffi-${{ matrix.target }}.zip' -Force"
          else
            zip -q -j "fagus-ffi-${{ matrix.target }}.zip" dist/*
          fi
          ls -l fagus-ffi-*
      - name: PHP smoke tests
        if: matrix.smoke == 'docker-x64'
        run: |
          so="/w/target/${{ matrix.target }}/release/libfagus_ffi.so"
          for version in 7.4 8.0 8.3 8.4; do
            echo "== PHP $version =="
            docker run --rm -v "$PWD:/w" -w /w "php:$version-cli" \
              sh /w/php/fagus-ffi/tests/php-smoke.sh /w/php/fagus-ffi "$so"
          done
      - name: PHP smoke test
        if: matrix.smoke == 'docker-arm'
        run: |
          so="/w/target/${{ matrix.target }}/release/libfagus_ffi.so"
          docker run --rm -v "$PWD:/w" -w /w php:8.4-cli \
            sh /w/php/fagus-ffi/tests/php-smoke.sh /w/php/fagus-ffi "$so"
      - name: PHP 8.4
        if: matrix.smoke == 'windows'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi
          ini-values: ffi.enable=true
      - name: Smoke test with PHP 8.4
        if: matrix.smoke == 'windows'
        run: php php/fagus-ffi/tests/smoke.php target/${{ matrix.target }}/release/fagus_ffi.dll
      - name: PHP 7.4
        if: matrix.smoke == 'windows'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: ffi
          ini-values: ffi.enable=true
      - name: Smoke test with PHP 7.4
        if: matrix.smoke == 'windows'
        run: php php/fagus-ffi/tests/smoke.php target/${{ matrix.target }}/release/fagus_ffi.dll
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            fagus-ffi-${{ matrix.target }}.tar.gz
            fagus-ffi-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fagus-ffi-${{ matrix.target }}
          path: |
            fagus-ffi-${{ matrix.target }}.tar.gz
            fagus-ffi-${{ matrix.target }}.zip
          if-no-files-found: error

  php:
    name: PHP package
    needs: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#ffi-v}"
          fi
          echo "FAGUS_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: fagus-ffi-*
      - name: Assemble the package
        shell: bash
        run: |
          cp -r php/fagus-ffi package
          for archive in artifacts/*/*.tar.gz; do
            target=$(basename "$archive" .tar.gz)
            target="${target#fagus-ffi-}"
            case "$target" in
              x86_64-unknown-linux-gnu) platform=linux-x86_64 ;;
              aarch64-unknown-linux-gnu) platform=linux-aarch64 ;;
              x86_64-pc-windows-msvc) platform=windows-x86_64 ;;
              *) echo "::error::unknown target $target"; exit 1 ;;
            esac
            mkdir -p "package/lib/$platform"
            tar -xzf "$archive" -C "package/lib/$platform" --wildcards '*.so' '*.dll'
          done
          find package/lib -type f | sort
      # The library is found by the package's own lib/ layout, not by an explicit path: this checks
      # Native::locate() as a user's installation sees it.
      - name: Smoke test the packaged layout
        run: |
          docker run --rm -v "$PWD:/w" -w /w php:8.4-cli sh -c '
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq libffi-dev >/dev/null 2>&1
            docker-php-ext-install ffi >/dev/null 2>&1
            php -d ffi.enable=true /w/package/tests/smoke.php'
      - name: Package the PHP package
        run: |
          tar -czf "fagus-ffi-php-${FAGUS_VERSION}.tar.gz" -C . package
          ls -l fagus-ffi-php-*
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: fagus-ffi-php-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: fagus-ffi-php
          path: fagus-ffi-php-*.tar.gz
          if-no-files-found: error

  release:
    name: Draft release
    if: github.event_name == 'push'
    needs:
      - library
      - php
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0
      # The tag must point at this branch: the workflow only publishes the preview, never a release
      # of main.
      - name: Check where the tag points
        working-directory: source
        run: |
          git fetch --no-tags origin spike/ffi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::the tag must point at spike/ffi"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: fagus-ffi-*
          merge-multiple: true
      - name: Notices
        run: cp source/THIRD-PARTY-NOTICES dist/
      - name: Sum
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#ffi-v}"
          gh release create "ffi-v$version" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Fagus FFI $version (preview)" \
            --notes "The C ABI shared library and the PHP 7.4+ package, built from $GITHUB_SHA. A draft: publish it by hand after checking it. Verify an asset with \`gh attestation verify <asset> --repo $GITHUB_REPOSITORY\`."
